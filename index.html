<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST FOR YOU ♥</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            /* تم تعديل الرابط هنا لقرأ الصورة من مشروعكِ الجديد NORYY تلقائياً */
            background-image: url('https://githubusercontent.com');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            height: 100vh; overflow: hidden; position: relative;
        }
        .heart-bg {
            position: absolute; color: #ff69b4; font-size: 16px; opacity: 0.2;
            animation: fall linear infinite; z-index: 1; user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; } 90% { opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .bottom-player-container {
            background: rgba(255, 240, 245, 0.75); backdrop-filter: blur(8px);
            padding: 15px 25px; border-radius: 25px 25px 0 0;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.15); text-align: center;
            width: 100%; max-width: 480px; z-index: 10; animation: slideUp 1s ease-out; margin-bottom: 0;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .song-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .song-title { font-size: 1.2rem; color: #c2185b; font-weight: bold; }
        .artist-name { font-size: 0.9rem; color: #ff4081; }
        .audio-container { background-color: rgba(255, 255, 255, 0.6); padding: 5px; border-radius: 50px; margin-bottom: 10px; }
        audio { width: 100%; height: 36px; outline: none; }
        .letter-box { border-top: 1px dashed rgba(216, 27, 96, 0.3); padding-top: 8px; }
        .letter-text { font-size: 1.1rem; color: #4a001f; font-weight: bold; text-align: center; margin: 0; }
    </style>
</head>
<body>
    <div id="hearts-container"></div>
    <div class="bottom-player-container">
        <div class="song-info">
            <span class="song-title">الغرام المستحيل ♥</span>
            <span class="artist-name">إهداء من أختِك وصاحبتِك</span>
        </div>
        <div class="audio-container">
            <audio controls>
                <source src="https://soundhelix.com" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>
        <div class="letter-box">
            <p class="letter-text">حاجة بسيطة لِكِ تفكرِكِ بيا</p>
        </div>
    </div>
    <script>
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-bg'; heart.innerText = '♥';
                heart.style.left = Math.random() * 100 + 'vw'; heart.style.top = Math.random() * -20 + 'vh';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's'; heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 10 + 12) + 'px'; container.appendChild(heart);
            }
        }
        createHearts();
    </script>
</body>
</html>
